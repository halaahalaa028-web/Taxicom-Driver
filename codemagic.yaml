workflows:
  taxicom-driver-ios:
    name: Taxicom Driver - iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Banuvra-iOS-Package
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - Taxicom-Driver-AppStore-2
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install iOS CocoaPods
        script: |
          cd ios
          pod install
      - name: Apply iOS code signing
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: |
          if ! xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme "Runner"; then
            echo "===== XCODE ERROR DETAILS ====="
            find /tmp/xcodebuild_logs -type f -name '*.log' -maxdepth 2 -print 2>/dev/null || true
            grep -n -B 8 -A 12 -E 'error:|fatal error:|BUILD FAILED|Error Domain=' /tmp/xcodebuild_logs/*.log 2>/dev/null || true
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  taxicom-driver-android:
    name: Taxicom Driver - Android AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
