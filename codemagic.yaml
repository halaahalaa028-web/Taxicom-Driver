workflows:
  taxicom-driver-ios:
    name: Taxicom Driver - iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Banuvra-iOS-Package
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - Taxicom-Driver-AppStore-2
    scripts:
      - name: Clean and get Flutter packages
        script: |
          flutter clean
          rm -rf ios/Pods ios/.symlinks ios/Flutter/ephemeral
          flutter pub get
      - name: Install and verify iOS CocoaPods
        script: |
          cd ios
          pod install --clean-install
          echo "===== FLUTTER PLUGIN METADATA ====="
          if [ -f "../.flutter-plugins-dependencies" ]; then
            grep -o '"name":"[^"]*"' ../.flutter-plugins-dependencies | sort -u
            echo "===== AUDIO / RECORD PLUGIN ENTRIES ====="
            grep -n -i -E "audioplayers|record" ../.flutter-plugins-dependencies || true
          else
            echo "ERROR: .flutter-plugins-dependencies was not generated"
          fi
          echo "===== POD TARGETS ====="
          grep -n -i -E "audioplayers|record|firebase|permission_handler" Pods/Pods.xcodeproj/project.pbxproj | head -100 || true
          echo "===== POD LOCK ENTRIES ====="
          grep -n -A 5 -B 1 -i -E "audioplayers|record|firebase|permission_handler" Podfile.lock || true
          if ! grep -q "audioplayers_darwin" "Pods/Pods.xcodeproj/project.pbxproj"; then
            echo "ERROR: audioplayers_darwin is missing; see plugin metadata and pod diagnostics above"
            exit 1
          fi
          echo "Verified: audioplayers_darwin is integrated into CocoaPods"
      - name: Apply iOS code signing
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: |
          if ! xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme "Runner"; then
            echo "===== XCODE ERROR DETAILS ====="
            find /tmp/xcodebuild_logs -type f -name '*.log' -maxdepth 2 -print 2>/dev/null || true
            grep -n -B 8 -A 12 -E 'error:|fatal error:|BUILD FAILED|Error Domain=' /tmp/xcodebuild_logs/*.log 2>/dev/null || true
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  taxicom-driver-android:
    name: Taxicom Driver - Android AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
