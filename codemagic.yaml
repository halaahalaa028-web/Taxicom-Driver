workflows:
  taxicom-driver-ios:
    name: Taxicom Driver - iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Banuvra-iOS-Package
    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - Taxicom Driver New
    scripts:
      - name: Clean and get Flutter packages
        script: |
          flutter clean
          rm -rf ios/Pods ios/.symlinks ios/Flutter/ephemeral
          flutter pub get
      - name: Install and verify iOS CocoaPods
        script: |
          cd ios
          pod install --clean-install
          echo "===== FLUTTER PLUGIN METADATA ====="
          if [ -f "../.flutter-plugins-dependencies" ]; then
            grep -o '"name":"[^"]*"' ../.flutter-plugins-dependencies | sort -u
            echo "===== AUDIO / RECORD PLUGIN ENTRIES ====="
            grep -n -i -E "audioplayers|record" ../.flutter-plugins-dependencies || true
          else
            echo "ERROR: .flutter-plugins-dependencies was not generated"
          fi
          echo "===== POD TARGETS ====="
          grep -n -i -E "audioplayers|record|firebase|permission_handler" Pods/Pods.xcodeproj/project.pbxproj | head -100 || true
          echo "===== POD LOCK ENTRIES ====="
          grep -n -A 5 -B 1 -i -E "audioplayers|record|firebase|permission_handler" Podfile.lock || true
          echo "Diagnostics complete. Flutter may manage some iOS plugins through Swift Package Manager rather than CocoaPods."
      - name: Prepare Flutter iOS Swift Package Manager integration
        script: |
          flutter build ios --release --no-codesign --build-number=8
      - name: Apply iOS code signing
        script: xcode-project use-profiles
      - name: Build signed iOS IPA
        script: |
          echo "===== FORCE APP STORE BUILD NUMBER ====="
          if [ ! -f ios/Flutter/Generated.xcconfig ]; then
            echo "ERROR: Generated.xcconfig is missing"
            exit 1
          fi
          sed -i '' 's/^FLUTTER_BUILD_NUMBER=.*/FLUTTER_BUILD_NUMBER=8/' ios/Flutter/Generated.xcconfig
          if ! grep -q '^FLUTTER_BUILD_NUMBER=8            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme "Runner"; then
            echo "===== XCODE ERROR DETAILS ====="
            find /tmp/xcodebuild_logs -type f -name '*.log' -maxdepth 2 -print 2>/dev/null || true
            grep -n -B 8 -A 12 -E 'error:|fatal error:|BUILD FAILED|Error Domain=' /tmp/xcodebuild_logs/*.log 2>/dev/null || true
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  taxicom-driver-android:
    name: Taxicom Driver - Android AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
 ios/Flutter/Generated.xcconfig; then
            echo "ERROR: Could not set FLUTTER_BUILD_NUMBER=8"
            exit 1
          fi
          export FLUTTER_BUILD_NUMBER=8
          grep '^FLUTTER_BUILD_NUMBER=' ios/Flutter/Generated.xcconfig
          echo "===== ARCHIVE ====="
          if ! xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/Runner.xcworkspace" \
            --scheme "Runner"; then
            echo "===== XCODE ERROR DETAILS ====="
            find /tmp/xcodebuild_logs -type f -name '*.log' -maxdepth 2 -print 2>/dev/null || true
            grep -n -B 8 -A 12 -E 'error:|fatal error:|BUILD FAILED|Error Domain=' /tmp/xcodebuild_logs/*.log 2>/dev/null || true
            exit 1
          fi
          echo "===== VERIFY IPA BUILD NUMBER ====="
          IPA_PATH="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "ERROR: IPA file was not created"
            exit 1
          fi
          ACTUAL_BUILD_NUMBER="$(unzip -p "$IPA_PATH" 'Payload/*.app/Info.plist' | plutil -extract CFBundleVersion raw -o - -)"
          echo "IPA CFBundleVersion=$ACTUAL_BUILD_NUMBER"
          if [ "$ACTUAL_BUILD_NUMBER" != "8" ]; then
            echo "ERROR: IPA build number is not 8; refusing to publish"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  taxicom-driver-android:
    name: Taxicom Driver - Android AAB
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/bundle/release/*.aab
      - build/app/outputs/mapping/release/mapping.txt
